services:
  job-hunter:
    build:
      context: .
    container_name: kan-job-hunter
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    init: true
    stop_grace_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    healthcheck:
      test: ["CMD", "python", "-m", "kan_job_hunter", "health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
